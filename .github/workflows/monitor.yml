name: Shopify monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # 5 minuutin valein
  workflow_dispatch:         # mahdollistaa ajon kasin
    inputs:
      dry_run:
        description: "Testiajo: ei posteta Discordiin eika tallenneta tilaa"
        type: boolean
        default: false
      test_webhooks:
        description: "Laheta testikortti SALES_WEBHOOKiin ja TRENDS_WEBHOOKiin"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: shopify-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Vain kasiajolla: tarkistaa etta #sales- ja #trends-webhookit toimivat.
      # Ei estä normaalia kierrosta vaikka webhook olisi rikki.
      - name: Testikortit
        if: ${{ inputs.test_webhooks }}
        continue-on-error: true
        env:
          SALES_WEBHOOK: ${{ secrets.SALES_WEBHOOK }}
          TRENDS_WEBHOOK: ${{ secrets.TRENDS_WEBHOOK }}
        run: python -u shopify_monitor.py --test-webhooks

      # Lisaa Discord-kanavalle postatut kaupat stores.json:iin ennen
      # monitorin kierrosta. Jos Discord ei vastaa, monitori ajetaan silti.
      - name: Lisaa kaupat Discordista
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          AI_STORES_CHANNEL_ID: ${{ secrets.AI_STORES_CHANNEL_ID }}
        run: python -u discord_intake.py ${{ inputs.dry_run && '--dry-run' || '' }}

      # Sama 5 min kierros hoitaa myos ristiinkauppaosumat (heti
      # TRENDS_WEBHOOKiin), 2 tunnin trendikoosteen (summary_state.json) ja
      # tunnin valein best-sellerit (best_sellers.json -> SALES_WEBHOOK).
      - name: Tarkista uudet tuotteet
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SALES_WEBHOOK: ${{ secrets.SALES_WEBHOOK }}
          TRENDS_WEBHOOK: ${{ secrets.TRENDS_WEBHOOK }}
        run: python -u shopify_monitor.py --once ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Tallenna tila
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in seen.json stores.json intake_state.json image_hashes.json \
                   best_sellers.json matches.json summary_state.json \
                   seen_missing.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet && echo "ei muutoksia" && exit 0
          git commit -m "update state"
          git pull --rebase
          git push
