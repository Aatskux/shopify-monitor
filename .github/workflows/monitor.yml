name: Shopify monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # 5 minuutin valein
  workflow_dispatch:         # mahdollistaa ajon kasin
    inputs:
      dry_run:
        description: "Testiajo: ei posteta Discordiin eika tallenneta tilaa"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: shopify-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Tarkista uudet tuotteet
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python -u shopify_monitor.py --once ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Tallenna tila
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet && echo "ei muutoksia" && exit 0
          git commit -m "update state"
          git pull --rebase
          git push
