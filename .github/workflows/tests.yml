name: Testit

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      smoke:
        description: "Aja lisaksi savutesti oikeita kauppoja vasten (ei posta Discordiin)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # metadata_cleaner tarvitsee ffmpegin; asennetaan vain jos kuvasta puuttuu
      - name: ffmpeg
        run: |
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null \
            || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ffmpeg -version | head -1

      - name: Yksikkotestit (valekauppa, vale-Discord, ei verkkoa)
        env:
          REQUIRE_FFMPEG: "1"
        run: python -u -m unittest -v test_shopify_monitor.py test_discord_intake.py test_metadata_cleaner.py

      # Savutesti hakee oikeat kaupat ja renderoi oikeat Discord-embedit,
      # mutta ajaa dry-runina: mitaan ei posteta eika tilaa kirjoiteta.
      # Tilasta pudotetaan kaupoittain pari tuoretta ID:ta, jotta embedien
      # muodostus paasee oikeasti ajoon.
      - name: Savutesti oikeita kauppoja vasten
        if: ${{ inputs.smoke }}
        run: |
          mkdir -p /tmp/smoke
          cp shopify_monitor.py stores.json /tmp/smoke/
          python - <<'PY'
          import json
          state = json.load(open("seen.json"))
          trimmed = {k: v[:-2] for k, v in state.items()}
          json.dump(trimmed, open("/tmp/smoke/seen.json", "w"))
          print(f"pudotettiin {sum(len(v) for v in state.values()) - sum(len(v) for v in trimmed.values())} ID:ta")
          PY
          cd /tmp/smoke && python -u shopify_monitor.py --once --dry-run
